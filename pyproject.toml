[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotai-module-d"
version = "0.1.0"
description = "Pure-Python vehicle-condition case domain models"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["module_d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
