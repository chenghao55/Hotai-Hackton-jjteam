[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotai-module-d"
version = "0.1.0"
description = "Pure-Python vehicle-condition case domain models"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ml = [
    "numpy>=2,<3",
    "Pillow>=11,<14",
    "scikit-learn>=1.6,<2",
    "scipy>=1.14,<2",
    "torch==2.13.0",
    "torchvision==0.28.0",
]

[tool.setuptools.packages.find]
include = ["module_b*", "module_d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
